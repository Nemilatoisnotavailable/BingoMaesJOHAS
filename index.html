<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bingo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&display=swap" rel="stylesheet">

<style>

:root{
    --verde:#00ff00;
}

*{
    box-sizing:border-box;
}

body{

    margin:0;
    padding:1vh;

    background:#111;
    color:white;

    font-family:'Lexend', sans-serif;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:flex-start;

    height:100vh;

    overflow:hidden;
}

h1{

    margin:0;

    font-size:min(5vw,48px);

    margin-bottom:1vh;
}

#rodada{

    position:absolute;

    top:1vh;
    left:1vw;

    font-size:min(2vw,22px);

    color:#999;

    font-weight:bold;
}

#ultimo{

    display:flex;

    align-items:center;

    justify-content:center;

    width:100%;

    font-size:min(14vw,140px);

    color:var(--verde);

    font-weight:bold;

    margin-bottom:2vh;

    line-height:1;
}

#container{

    width:100%;

    height:100%;

    display:flex;

    justify-content:center;

    align-items:center;
}

table{

    border-collapse:collapse;

    width:min(95vw,1400px);

    height:min(70vh,900px);

    table-layout:fixed;
}

td{

    border:0.2vh solid #333;

    text-align:center;

    background:#1a1a1a;

    transition:0.2s;

    font-size:min(2.5vw,32px);

    font-weight:bold;

    padding:0;

    color:white;
}

.letra{

    background:#222;

    color:var(--verde);

    font-size:min(4vw,42px);
}

.chamado{

    background:var(--verde);

    color:black;

    box-shadow:0 0 1vw var(--verde);
}

.piscando{

    animation:piscar 2s infinite;
}

@keyframes piscar{

    0%{

        background:var(--verde);
        color:black;
        box-shadow:0 0 1vw var(--verde);
    }

    49%{

        background:var(--verde);
        color:black;
        box-shadow:0 0 1vw var(--verde);
    }

    50%{

        background:#1a1a1a;
        color:white;
        box-shadow:none;
    }

    99%{

        background:#1a1a1a;
        color:white;
        box-shadow:none;
    }

    100%{

        background:var(--verde);
        color:black;
        box-shadow:0 0 1vw var(--verde);
    }
}

.duplo{

    height:calc(200% + 0.2vh);
}

</style>
</head>

<body>

<div id="rodada">Rodada: #</div>

<h1>BINGO</h1>

<div id="ultimo">Aguarde...</div>

<div id="container">

<table id="tabela"></table>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbze3zT-MQTlYz4AoZjjt3oqBqs8tFjzkUzXuN-RhrWE4RnV1mZea1NCzFiOybDDRnfKOA/exec";

const TEXTO_PADRAO = "Nova Rodada";

function gerarTabela(chamados){

    const tabela = document.getElementById("tabela");

    tabela.innerHTML = "";

    const letras = ["B","I","N","G","O"];

    let inicio = 1;

    const ultimoNumero =
        chamados.length > 0
        ? chamados[chamados.length - 1]
        : null;

    for(let l = 0; l < letras.length; l++){

        const tr1 = document.createElement("tr");

        const tr2 = document.createElement("tr");

        const letra = document.createElement("td");

        letra.className = "letra duplo";

        letra.rowSpan = 2;

        letra.innerText = letras[l];

        tr1.appendChild(letra);

        for(let i = 0; i < 8; i++){

            const num1 = inicio + (i * 2);

            const num2 = inicio + 1 + (i * 2);

            const td1 = document.createElement("td");

            td1.innerText = num1;

            if(chamados.includes(num1)){

                td1.classList.add("chamado");
            }

            if(num1 === ultimoNumero){

                td1.classList.remove("chamado");

                td1.classList.add("piscando");
            }

            if(num1 % 15 === 0){

                td1.rowSpan = 2;

                td1.classList.add("duplo");

                tr1.appendChild(td1);

            }else{

                tr1.appendChild(td1);

                const td2 = document.createElement("td");

                td2.innerText = num2;

                if(chamados.includes(num2)){

                    td2.classList.add("chamado");
                }

                if(num2 === ultimoNumero){

                    td2.classList.remove("chamado");

                    td2.classList.add("piscando");
                }

                tr2.appendChild(td2);
            }
        }

        tabela.appendChild(tr1);
        tabela.appendChild(tr2);

        inicio += 15;
    }
}

async function atualizar(){

    try{

        const res = await fetch(API);

        const dados = await res.json();

        const chamados = dados.chamados;

        document.getElementById("rodada").innerText =
            "Rodada: " + dados.rodada;

        if(chamados.length > 0){

            document.getElementById("ultimo").innerText =
                chamados[chamados.length - 1];

        }else{

            document.getElementById("ultimo").innerText =
                TEXTO_PADRAO;
        }

        gerarTabela(chamados);

    }catch(e){

        console.log(e);
    }
}

atualizar();

setInterval(atualizar, 2000);

</script>

</body>
</html>
